name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Pest, Pint, PHPStan, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - run: cp .env.example .env && php artisan key:generate
      # No API key in CI: the suite uses the scripted brain and a fake Anthropic transport.
      - run: php artisan test --compact
      - run: touch database/database.sqlite && php artisan migrate --force
      - run: php artisan thornbridge:eval --driver=scripted

  docker:
    name: Docker image boots and serves the game
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t thornbridge .
      - run: docker run -d --name thornbridge -p 8080:8080 -e APP_ENV=production -e APP_DEBUG=false -e AI_DRIVER=scripted thornbridge
      - run: |
          for i in $(seq 1 30); do curl -fs http://localhost:8080/up && exit 0; sleep 2; done
          docker logs thornbridge
          exit 1
      - run: curl -fs -X POST http://localhost:8080/api/games -H 'Accept: application/json' | grep -q '"token"'
